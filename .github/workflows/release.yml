name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish release (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog section for the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v pat="^## \\[$TAG\\]" 'BEGIN { p=0 } $0 ~ pat { p=1; next } /^## \[/ { if (p) exit } p' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Domovoy ${GITHUB_REF_NAME}" > release_notes.md
          fi
          echo '--- release notes ---'
          cat release_notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAG=""
          case "${GITHUB_REF_NAME}" in
            v0.*) FLAG="--prerelease" ;;
          esac
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists - skipping create"
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release_notes.md $FLAG
          fi
