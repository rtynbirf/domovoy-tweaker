PackageIdentifier: Rtynbirf.Domovoy
PackageVersion: __VERSION__
Installers:
  - Architecture: x64
    InstallerType: zip
    InstallerUrl: https://github.com/rtynbirf/domovoy-tweaker/releases/download/v__VERSION__/Domovoy-__VERSION__.zip
    InstallerSha256: __SHA256__
    NestedInstallerType: portable
    NestedInstallerFiles:
